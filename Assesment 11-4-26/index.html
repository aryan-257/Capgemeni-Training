<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index - Simple Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1a1a2e;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #4a90e2;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.88; }

    .btn-add      { background-color: #28a745; }
    .btn-subtract { background-color: #007bff; }
    .btn-multiply { background-color: #fd7e14; }
    .btn-divide   { background-color: #dc3545; }

    .result-box {
      background: #f0f4f8;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .result-label {
      font-weight: 600;
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .error { color: #dc3545; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Index - Simple Calculator</h1>
    <p class="subtitle">Trainer Name: [Pankaj]</p>

    <form id="calcForm" onsubmit="return false;">
      <label for="num1">First Number (Integer)</label>
      <input type="number" id="num1" placeholder="Enter first number" step="1">

      <label for="num2">Second Number (Integer)</label>
      <input type="number" id="num2" placeholder="Enter second number" step="1">

      <div class="btn-grid">
        <button class="btn-add"      onclick="calculate('add')">Add</button>
        <button class="btn-subtract" onclick="calculate('subtract')">Subtract</button>
        <button class="btn-multiply" onclick="calculate('multiply')">Multiply</button>
        <button class="btn-divide"   onclick="calculate('divide')">Division</button>
      </div>
    </form>

    <div class="result-box">
      <div class="result-label">Calculated Result</div>
      <div class="result-value" id="result">—</div>
    </div>
  </div>

  <script>
    function add(a, b)      { return a + b; }
    function subtract(a, b) { return a - b; }
    function multiply(a, b) { return a * b; }
    function divide(a, b)   { return a / b; }

    const symbols = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

    function calculate(op) {
      const resultEl = document.getElementById('result');
      const raw1 = document.getElementById('num1').value;
      const raw2 = document.getElementById('num2').value;

      if (raw1 === '' || raw2 === '') {
        resultEl.innerHTML = '<span class="error">Please enter both numbers.</span>';
        return;
      }

      const a = op === 'divide' ? parseFloat(raw1) : parseInt(raw1, 10);
      const b = op === 'divide' ? parseFloat(raw2) : parseInt(raw2, 10);

      if (op === 'divide' && b === 0) {
        resultEl.innerHTML = '<span class="error">Cannot divide by zero.</span>';
        return;
      }

      const result = { add, subtract, multiply, divide }[op](a, b);
      const display = Number.isInteger(result) ? result : result.toFixed(2);

      resultEl.textContent = `${a} ${symbols[op]} ${b} = ${display}`;
    }
  </script>
</body>
</html>
